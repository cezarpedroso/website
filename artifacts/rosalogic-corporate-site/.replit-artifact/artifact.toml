kind = "web"
previewPath = "/"
title = "ROSALOGIC Corporate Website"
description = "A corporate website for ROSALOGIC, a software engineering company that designs, builds, deploys, and maintains systems for organizations with complex operations."
version = "1.0.0"
id = "artifacts/rosalogic-corporate-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19886

[services.development]
run = "pnpm --filter @workspace/rosalogic-corporate-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rosalogic-corporate-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/rosalogic-corporate-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

# This hash is for the JSON-LD script in index.html; update it if that script changes.
# No frame-ancestors restriction: the Replit preview embeds this page in an iframe.
[[services.production.responseHeaders]]
path = "/*"
name = "Content-Security-Policy"
value = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-36OLfqtmEOpBTQ4WuhVCQ8ldmmiV4ZvQTmUsXDonNgs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Content-Type-Options"
value = "nosniff"

[[services.production.responseHeaders]]
path = "/*"
name = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[services.env]
PORT = "19886"
BASE_PATH = "/"