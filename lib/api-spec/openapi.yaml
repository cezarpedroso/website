openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactRequest
      tags: [contact]
      summary: Submit an inquiry
      description: Stores an inquiry for ROSALOGIC to review. Email notification is best effort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Inquiry securely stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"
        "400":
          description: Invalid form input
        "403":
          description: Request is not from this site
        "409":
          description: A submission with this request ID already exists with different content
        "415":
          description: Unsupported content type
        "429":
          description: Too many requests
  /owner/inquiries:
    get:
      operationId: listOwnerInquiries
      tags: [contact]
      summary: List inquiries for the verified inbox owner
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [pending, all], default: pending }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Page of up to 100 inquiries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerInquiry" }
        "401": { description: Sign-in required }
        "403": { description: Not the inbox owner }
  /owner/inquiries/{id}/retry:
    post:
      operationId: retryOwnerInquiry
      tags: [contact]
      summary: Retry an inquiry known not to have been sent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerInquiry" }
        "401": { description: Sign-in required }
        "403": { description: Not the inbox owner }
        "404": { description: Inquiry not found }
        "409": { description: Retry not safe or inquiry already claimed }
  /owner/inquiries/{id}/review:
    post:
      operationId: reviewOwnerInquiry
      tags: [contact]
      summary: Mark an inquiry as handled without changing delivery status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerInquiry" }
        "401": { description: Sign-in required }
        "403": { description: Not the inbox owner }
        "404": { description: Inquiry not found }
components:
  schemas:
    OwnerInquiry:
      type: object
      required: [id, name, email, company, message, createdAt, deliveryState, notificationSentAt, reviewedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        company: { type: ["string", "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [unsent, sending, sent, uncertain] }
        notificationSentAt: { type: ["string", "null"], format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactMessageInput:
      type: object
      additionalProperties: false
      required: [requestId, name, email, message]
      properties:
        requestId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          maxLength: 160
        message:
          type: string
          minLength: 1
          maxLength: 4000
        website:
          type: string
          maxLength: 120
          description: Leave empty. Used to identify automated submissions.
    ContactReceipt:
      type: object
      properties:
        received:
          type: boolean
      required: [received]

